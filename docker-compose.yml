version: "3.9"
services:      # A service is a container in docker-compose run 
  app:          #app means django project
    build:
      context: .  #context .  means current directory
      args:       #build args are used to pass build-time variables to the Dockerfile
        - DEV=true    # passes the true
    ports:
      - "8000:8000"   # maps port 8000 of the host to port 8000 of the container
    volumes:        # A volume allow files to be shared between the computer and the container
      - ./app:/app  #folder name app in the current directory is mounted to /app in the container
    command: >
      sh -c 
      "python manage.py wait_for_db &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
      
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASSWORD=devpass
    depends_on:
      - db
  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpass
    
volumes:
  dev-db-data: